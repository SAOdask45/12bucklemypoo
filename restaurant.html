<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bistro Baas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Lilita+One&display=swap">
<style>
/* Layout: kassa-balk bovenaan, restaurantvloer (canvas) links, beheer-klembord rechts; op telefoon onder elkaar */
:root{
  --bg:#121c18; --panel:#1a2722; --panel-2:#22332d; --line:#34493f;
  --fg:#f1ecdc; --muted:#a3b6ab; --brass:#e3b04b; --brass-ink:#2a1e05;
  --tomato:#ec5a40; --basil:#74c66f; --frost:#7cc3e8;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1340px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-size:30px;line-height:1;color:var(--brass);letter-spacing:.5px;margin:0}
.brand span{color:var(--fg)}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 11px;min-width:74px}
.stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.neg{color:var(--tomato)}
.speed{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.speed button{font:inherit;font-weight:800;background:transparent;color:var(--muted);border:0;padding:0 12px;min-height:44px;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;margin-top:12px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.floor{min-width:0;display:flex;flex-direction:column;gap:10px}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;min-height:58px}
.banner p{margin:0;min-width:0;flex:1 1 280px;color:var(--muted)}
.banner p b{color:var(--fg)}
.banner .warn{color:var(--tomato)}
canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:900/560;border-radius:12px;background:#2a1d14;cursor:grab;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12.5px}
.legend span{white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;font-size:13px;background:transparent;border:0;color:var(--muted);padding:12px 4px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brass)}
#pane{padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-height:620px;overflow:auto}
.pane-h{font-family:var(--display);font-size:18px;letter-spacing:.3px;margin:4px 0 0;font-weight:400}
.note{color:var(--muted);font-size:12.5px;margin:0}
.row{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.row .line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row .line > *{min-width:0}
.role{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;padding:2px 7px;border-radius:99px;margin-right:6px}
.role.kok{background:#f1ecdc;color:#1a2722}
.role.ober{background:#0d1512;color:var(--brass);border:1px solid var(--brass)}
.attrs{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.pips{color:var(--brass);letter-spacing:1px;margin-left:3px}
.pips i{font-style:normal;color:#3d5249}
.bar{display:inline-block;width:70px;height:7px;border-radius:9px;background:#0f1714;overflow:hidden;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%}
.chip{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.chip.good{background:rgba(116,198,111,.18);color:var(--basil)}
.chip.mid{background:rgba(227,176,75,.18);color:var(--brass)}
.chip.bad{background:rgba(236,90,64,.18);color:var(--tomato)}
.dish{font-weight:600}
.dish .em{font-size:18px;margin-right:4px}
.num{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:7px 12px;min-height:36px;background:var(--brass);color:var(--brass-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.big{font-family:var(--display);font-weight:400;font-size:18px;padding:9px 18px;letter-spacing:.3px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.price{display:flex;align-items:center;gap:6px}
.price .btn{min-width:36px;padding:7px 0}
.price b{min-width:44px;text-align:center}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#log{border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-height:120px}
#log b{color:var(--fg);font-weight:600}
#log .t{font-variant-numeric:tabular-nums;color:var(--brass);margin-right:6px}
#toast[hidden]{display:none}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tomato);color:#fff;font-weight:700;padding:9px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(5,10,8,.74);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:540px;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--brass);text-wrap:balance}
.sheet h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr auto;gap:4px 16px}
.grid2 span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.grid2 .total{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:800}
.review{background:var(--panel-2);border-radius:10px;padding:8px 12px}
.review .s{color:var(--brass);letter-spacing:1px}
.review .s i{font-style:normal;color:#3d5249}
.msgs{margin:0;padding-left:18px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Bistro <span>Baas</span></h1>
    <div class="stats">
      <div class="stat"><small>Dag</small><b id="sDay">1</b></div>
      <div class="stat"><small>Klok</small><b id="sClock">10:30</b></div>
      <div class="stat"><small>Kas</small><b id="sCash">€0</b></div>
      <div class="stat"><small>Reputatie</small><b id="sRep">3,0 ★</b></div>
      <div class="stat"><small>Bediend</small><b id="sServed">0</b></div>
      <div class="stat"><small>Jij</small><b id="sMgr">klaar</b></div>
      <div class="speed" role="group" aria-label="Spelsnelheid">
        <button type="button" data-act="speed" data-id="0" aria-pressed="false" title="Pauze (spatie)">II</button>
        <button type="button" data-act="speed" data-id="1" aria-pressed="true">1×</button>
        <button type="button" data-act="speed" data-id="2" aria-pressed="false">2×</button>
        <button type="button" data-act="speed" data-id="3" aria-pressed="false">3×</button>
      </div>
    </div>
  </header>

  <div class="main">
    <section class="floor">
      <div class="banner" id="banner"></div>
      <canvas id="cv" width="900" height="560" aria-label="Plattegrond van het restaurant"></canvas>
      <div class="legend">
        <span>Klik op een <b>gerecht op de uitgifte</b> om het zelf te brengen</span>
        <span>Klik op een tafel met <b>📋</b> om de bestelling op te nemen</span>
        <span>Klik op een <b>vuile tafel</b> om af te ruimen</span>
        <span>Sleep om te draaien, scroll om te zoomen</span>
        <span>Ring om gerecht: <b style="color:var(--tomato)">heet</b> → <b style="color:var(--frost)">koud</b></span>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-act="tab" data-id="personeel">Personeel</button>
        <button type="button" role="tab" data-act="tab" data-id="inkoop">Inkoop</button>
        <button type="button" role="tab" data-act="tab" data-id="menu">Menu</button>
        <button type="button" role="tab" data-act="tab" data-id="verbouw">Verbouwen</button>
      </div>
      <div id="pane"></div>
      <div id="log"></div>
    </aside>
  </div>
</div>
<div id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const W = 900, H = 560;
const cv = document.getElementById('cv');
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const euro = v => (v < 0 ? '−' : '') + '€' + Math.abs(Math.round(v)).toLocaleString('nl-NL');
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const DISPLAY = '"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif';

const DISHES = [
  { id: 'soep',   naam: 'Tomatensoep',  emoji: '🍲', prijs: 8,  kost: 2.4, tijd: 3.5, warm: true },
  { id: 'salade', naam: 'Salade',       emoji: '🥗', prijs: 9,  kost: 2.8, tijd: 2.5, warm: false },
  { id: 'pasta',  naam: 'Pasta',        emoji: '🍝', prijs: 13, kost: 3.8, tijd: 5.5, warm: true },
  { id: 'burger', naam: 'Burger',       emoji: '🍔', prijs: 15, kost: 4.6, tijd: 6.5, warm: true },
  { id: 'vis',    naam: 'Gegrilde vis', emoji: '🐟', prijs: 19, kost: 6.5, tijd: 8,   warm: true },
  { id: 'taart',  naam: 'Appeltaart',   emoji: '🥧', prijs: 6,  kost: 1.6, tijd: 1.5, warm: false },
];
const DM = Object.fromEntries(DISHES.map(d => [d.id, d]));
// versheid per dag oud; zonder koelcel bederft alles na 4 dagen
const FRESH_BASE = [1, .85, .6, .3], FRESH_COOL = [1, .95, .85, .65, .35];
const NAMES = ['Sanne','Daan','Fleur','Jesse','Noor','Bram','Lotte','Milan','Eva','Thijs','Femke','Ruben','Isa','Sem','Julia','Luuk','Anouk','Mehmet','Yasmina','Kevin','Priya','Tom','Lieke','Joost','Fatima','Niels','Wouter','Ilse','Rachid','Merel'];
const TABLE_POS = [[420,150],[555,150],[690,150],[825,150],[420,355],[555,355],[690,355],[825,355]];
const DOOR = { x: 872, y: 528 };
const stoveY = k => 100 + k * 115;
const OPEN_T = 150, CLOSE_T = 165; // sim-seconden: 21:00 laatste gasten, 22:00 deur dicht
const RV = {
  koud: ['Mijn {d} was lauw.', 'Het eten kwam koud aan tafel.', 'Koude {d}? Echt niet.'],
  oud: ['De {d} smaakte niet vers.', 'Ingrediënten waren over de datum, proefde je.'],
  smaak: ['De kok kan wel wat bijleren.', 'Smaakte nergens naar.'],
  wachten: ['Veel te lang gewacht.', 'Duurde eeuwen voordat er iemand kwam.', 'Service was traag.'],
  duur: ['Prijzig voor wat je krijgt.', 'Veel te duur.'],
  uitverkocht: ['Mijn keuze was uitverkocht.', 'Half de kaart was op.'],
  weggelopen: ['Niemand kwam, wij zijn maar weggegaan.', 'Na een eeuwigheid wachten vertrokken.'],
  top: ['Heerlijk vers en lekker warm!', 'Snelle service, top!', 'Wij komen zeker terug.', 'Beste {d} van de stad.'],
  ok: ['Prima, niks bijzonders.', 'Was oké.', 'Redelijk etentje.'],
};

let uid = 1, S, D, speed = 1, tab = 'personeel', holding = false;

/* ---------- opslaan ---------- */
function save() { try { localStorage.setItem('bistrobaas-save', JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem('bistrobaas-save')); if (s && s.day && s.staff) return s; } catch (e) {} return null; }
function bestDay() { try { return +localStorage.getItem('bistrobaas-best') || 0; } catch (e) { return 0; } }
function setBest(n) { try { if (n > bestDay()) localStorage.setItem('bistrobaas-best', String(n)); } catch (e) {} }

/* ---------- personeel ---------- */
function wage(role, a, b) { return Math.round((role === 'kok' ? 40 : 30) + (a + b) * (role === 'kok' ? 10 : 8) + rnd(-6, 6)); }
function freeName() { const used = new Set([...S.staff, ...S.candidates].map(x => x.naam)); const opts = NAMES.filter(n => !used.has(n)); return pick(opts.length ? opts : NAMES); }
function mkStaff(role, a, b, naam) { return { id: uid++, role, naam: naam || freeName(), a, b, loon: wage(role, a, b), moraal: 80 }; }
function genCandidates() {
  S.candidates = [];
  ['kok', 'kok', 'ober', 'ober'].forEach(role => S.candidates.push(mkStaff(role, ri(1, 5), ri(1, 5))));
}
const cookSpeed = st => (0.55 + 0.2 * st.a) * (st.moraal < 40 ? 0.85 : 1);
const waiterSpeed = st => (85 + 22 * st.a) * (st.moraal < 40 ? 0.85 : 1);

/* ---------- voorraad ---------- */
const freshTable = () => S.koel ? FRESH_COOL : FRESH_BASE;
const stockQty = id => S.stock[id].reduce((s, b) => s + b.qty, 0);
function takeStock(id) {
  const arr = S.stock[id].sort((x, y) => y.age - x.age);
  const b = arr.find(b => b.qty > 0);
  if (!b) return null;
  b.qty--;
  const f = freshTable()[b.age] ?? .2;
  S.stock[id] = arr.filter(b => b.qty > 0);
  return f;
}
const isOpen = () => D && D.phase === 'open';
const buyCost = id => Math.round(DM[id].kost * 5 * (isOpen() ? 1.3 : 1));

/* ---------- verbouwingen ---------- */
const UPG = [
  { id: 'tafel', naam: 'Extra tafel', desc: 'Meer gasten tegelijk. Maximaal 8 tafels.', cost: () => 250 + 120 * (S.tables - 4), can: () => S.tables < 8, apply: () => { S.tables++; syncTables(); } },
  { id: 'fornuis', naam: 'Extra fornuis', desc: 'Nog een kok kan tegelijk koken. Maximaal 4.', cost: () => 450 + 250 * (S.stoves - 2), can: () => S.stoves < 4, apply: () => { S.stoves++; } },
  { id: 'lamp', naam: 'Warmhoudlamp', desc: 'Gerechten op de uitgifte koelen half zo snel af.', cost: () => 350, can: () => !S.lamp, apply: () => { S.lamp = true; } },
  { id: 'koel', naam: 'Koelcel', desc: 'Ingrediënten blijven een dag langer goed en verliezen minder versheid.', cost: () => 450, can: () => !S.koel, apply: () => { S.koel = true; } },
  { id: 'reclame', naam: 'Advertentie in de krant', desc: 'Vandaag komen er 60% meer gasten.', cost: () => 120, can: () => !S.advert, apply: () => { S.advert = true; } },
];

/* ---------- spel starten ---------- */
function newGame() {
  uid = 1;
  S = { day: 1, cash: 1200, rep: 3, tables: 4, stoves: 2, lamp: false, koel: false, advert: false, staff: [], candidates: [], stock: {}, menu: {}, debt: 0 };
  DISHES.forEach(d => { S.stock[d.id] = [{ qty: d.id === 'vis' ? 4 : 6, age: 0 }]; S.menu[d.id] = { on: true, prijs: d.prijs }; });
  S.staff.push(mkStaff('kok', 3, 3, 'Sanne'), mkStaff('ober', 3, 3, 'Daan'));
  genCandidates();
  save();
  startDay();
}
function startDay() {
  D = { phase: 'prep', t: 0, parties: [], tables: [], tickets: [], pass: [], workers: [], spawnAcc: 0, mgrCd: 0, floaters: [], log: [], closed: false,
        cashStart: S.cash, stats: { served: 0, guests: 0, left: 0, turned: 0, revenue: 0, tips: 0, buy: 0, invest: 0, ratings: [], reviews: [] } };
  syncTables(); syncWorkers();
  $('modal').hidden = true;
  log(`Dag ${S.day} begint. Bereid je voor op de lunch.`);
  renderAll();
}
function syncTables() {
  if (!D) return;
  while (D.tables.length < S.tables) { const i = D.tables.length; D.tables.push({ i, x: TABLE_POS[i][0], y: TABLE_POS[i][1], party: null, dirty: false, claimed: null }); }
}
function syncWorkers() {
  D.workers = D.workers.filter(w => S.staff.includes(w.st));
  for (const st of S.staff) if (!D.workers.some(w => w.st === st)) {
    const atDoor = D.phase === 'open';
    D.workers.push({ st, x: atDoor ? DOOR.x : (st.role === 'kok' ? 150 : 360), y: atDoor ? DOOR.y : 270, task: null, carry: null, busy: 0 });
  }
}
function openDoors() {
  if (!DISHES.some(d => S.menu[d.id].on)) return toast('Zet minstens één gerecht op het menu.');
  D.phase = 'open';
  log('De deuren zijn open!');
}

/* ---------- simulatie ---------- */
function clockMin() { return 660 + D.t * 4; }
function fmtClock() { const m = Math.floor(clockMin()); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function priceIndex() {
  const on = DISHES.filter(d => S.menu[d.id].on);
  return on.length ? on.reduce((s, d) => s + S.menu[d.id].prijs / d.prijs, 0) / on.length : 1;
}
function arrivalRate() {
  const h = clockMin() / 60;
  const curve = .35 + 1.1 * Math.exp(-((h - 12.5) ** 2) / 1.2) + 1.4 * Math.exp(-((h - 19) ** 2) / 2.5);
  const priceAttr = clamp(1.4 - .4 * priceIndex(), .45, 1.3);
  return .09 * curve * (.3 + .35 * S.rep) * priceAttr * (S.advert ? 1.6 : 1);
}
function spawnParty() {
  const waiting = D.parties.filter(p => p.state === 'door').length;
  if (waiting >= 6) { D.stats.turned++; floater(DOOR.x - 30, DOOR.y - 30, 'Vol!', '#ec5a40'); return; }
  D.parties.push({ id: uid++, size: pick([1, 2, 2, 2, 3, 3, 4]), x: W + 20, y: DOOR.y, qx: DOOR.x, qy: DOOR.y, state: 'door', mood: 100, timer: 0, table: null, items: [], reasons: new Set(), claimed: null, charme: 3 });
}
function moveTo(o, x, y, sp, dt) {
  const dx = x - o.x, dy = y - o.y, d = Math.hypot(dx, dy), s = sp * dt;
  if (d <= s || d < .5) { o.x = x; o.y = y; return true; }
  o.x += dx / d * s; o.y += dy / d * s; return false;
}
function update(dt) {
  if (D.phase !== 'open') return;
  D.t += dt;
  if (D.t < OPEN_T) {
    D.spawnAcc += arrivalRate() * dt;
    while (D.spawnAcc >= 1) { D.spawnAcc--; spawnParty(); }
  } else if (D.t >= CLOSE_T && !D.closed) {
    D.closed = true;
    D.parties.filter(p => p.state === 'door').forEach(p => { p.state = 'leave'; p.gone = true; D.stats.turned++; });
    log('De deur gaat dicht. Laatste gasten worden nog bediend.');
  }
  // gasten naar vrije, schone tafels brengen
  for (const t of D.tables) if (!t.party && !t.dirty) {
    const p = D.parties.find(p => p.state === 'door');
    if (p) { p.state = 'walk'; p.table = t; t.party = p; p.timer = 0; }
  }
  let k = 0;
  for (const p of D.parties) if (p.state === 'door') { p.qx = 840 - k * 44; p.qy = DOOR.y; k++; }
  D.parties.forEach(p => updParty(p, dt));
  D.parties = D.parties.filter(p => !p.remove);
  const cool = S.lamp ? 2 : 4.5;
  D.pass.forEach(d => { if (d.tk.item.dish.warm) d.temp = Math.max(15, d.temp - cool * dt); });
  D.workers.forEach(w => { if (w.carry && w.carry.tk.item.dish.warm) w.carry.temp = Math.max(15, w.carry.temp - 4.5 * dt); });
  let kc = 0, kw = 0;
  for (const w of D.workers) { if (w.st.role === 'kok') updCook(w, dt, kc++); else updWaiter(w, dt, kw++); }
  if (D.t >= CLOSE_T && D.parties.length === 0) endDay();
}
function updParty(p, dt) {
  p.timer += dt;
  switch (p.state) {
    case 'door': moveTo(p, p.qx, p.qy, 120, dt); if (p.timer > 6) p.mood -= 4 * dt; break;
    case 'walk': if (moveTo(p, p.table.x, p.table.y, 130, dt)) { p.state = 'menu'; p.timer = 0; } break;
    case 'menu': if (p.timer > 2) { p.state = 'order'; p.timer = 0; } break;
    case 'order': if (p.timer > 4) p.mood -= 5 * dt; break;
    case 'wait': if (p.timer > 10 + 4 * p.items.length) p.mood -= 3 * dt; break;
    case 'eat': if (p.timer > p.eatDur) finishParty(p); break;
    case 'leave': if (moveTo(p, W + 30, DOOR.y, 150, dt)) p.remove = true; break;
  }
  if (['door', 'order', 'wait'].includes(p.state) && p.mood < 60) p.reasons.add('wachten');
  if (['door', 'menu', 'order', 'wait'].includes(p.state) && p.mood <= 0) angryLeave(p);
}
function takeOrder(p, st) {
  const menu = DISHES.filter(d => S.menu[d.id].on);
  if (menu.some(d => stockQty(d.id) === 0) && Math.random() < .3) { p.reasons.add('uitverkocht'); p.mood -= 8; }
  for (let i = 0; i < p.size; i++) {
    const opts = menu.filter(d => stockQty(d.id) > 0);
    if (!opts.length) { p.reasons.add('uitverkocht'); continue; }
    const d = pick(opts);
    const item = { dish: d, fresh: takeStock(d.id), prijs: S.menu[d.id].prijs, served: false, score: 0 };
    p.items.push(item);
    D.tickets.push({ party: p, item });
  }
  p.charme = st ? st.b : 3;
  if (!p.items.length) {
    p.state = 'leave'; p.gone = true; p.table.party = null; p.table = null;
    rate(p, 2); D.stats.left++;
    floater(p.x, p.y - 40, 'Alles op!', '#ec5a40');
    log('Gasten vertrokken: <b>alles uitverkocht</b>.');
    return;
  }
  p.state = 'wait'; p.timer = 0;
  p.mood = Math.min(100, p.mood + (p.charme - 2) * 3);
}
function dishScore(p, item, temp, q) {
  const d = item.dish, f = item.fresh;
  let s = 30 * f + 25 * (q / 5) + (d.warm ? 45 * clamp((temp - 35) / 45, 0, 1) : 45 * f);
  const r = item.prijs / d.prijs;
  s -= Math.max(0, r - 1) * 90; s += Math.max(0, 1 - r) * 25;
  if (d.warm && temp < 55) p.reasons.add('koud');
  if (f < .7) p.reasons.add('oud');
  if (q <= 2) p.reasons.add('smaak');
  if (r > 1.25) p.reasons.add('duur');
  return clamp(s, 0, 100);
}
function serveDish(d) {
  const p = d.tk.party, item = d.tk.item;
  item.served = true; item.temp = d.temp;
  item.score = dishScore(p, item, d.temp, d.q);
  const t = p.table;
  if (item.dish.warm && d.temp < 55) floater(t.x, t.y - 30, `Koud! ${Math.round(d.temp)}°`, '#7cc3e8');
  if (p.items.every(i => i.served)) { p.state = 'eat'; p.timer = 0; p.eatDur = 7 + p.items.length * 1.2; }
}
function rate(p, stars) {
  D.stats.ratings.push(stars);
  S.rep = clamp(S.rep * .93 + stars * .07, 1, 5);
  const r = [...p.reasons];
  let txt = stars >= 4 ? pick(RV.top) : r.length ? pick(RV[pick(r)]) : pick(RV.ok);
  txt = txt.replace('{d}', (p.items[0] ? p.items[0].dish.naam : 'eten').toLowerCase());
  D.stats.reviews.push({ stars, txt });
}
function finishParty(p) {
  const avg = p.items.reduce((s, i) => s + i.score, 0) / p.items.length;
  const stars = clamp(Math.ceil((p.mood * .35 + avg * .65) / 20), 1, 5);
  const pay = p.items.reduce((s, i) => s + i.prijs, 0);
  const tip = stars >= 4 ? Math.round(pay * (.04 + .025 * p.charme) * (stars - 3)) : 0;
  S.cash += pay + tip;
  D.stats.revenue += pay; D.stats.tips += tip; D.stats.served++; D.stats.guests += p.size;
  rate(p, stars);
  const t = p.table;
  floater(t.x, t.y - 44, `+${euro(pay + tip)}  ${'★'.repeat(stars)}`, stars >= 4 ? '#e3b04b' : stars >= 3 ? '#f1ecdc' : '#ec5a40');
  t.party = null; t.dirty = true;
  p.state = 'leave'; p.gone = true; p.table = null;
}
function angryLeave(p) {
  p.gone = true;
  if (p.table) {
    floater(p.table.x, p.table.y - 40, 'Weggelopen!', '#ec5a40');
    p.table.party = null;
    p.table.dirty = p.items.some(i => i.served);
    p.table = null;
  } else floater(p.x, p.y - 30, 'Weg!', '#ec5a40');
  D.tickets = D.tickets.filter(t => t.party !== p);
  D.pass = D.pass.filter(d => d.tk.party !== p);
  p.reasons.add('weggelopen'); p.reasons.delete('wachten');
  rate(p, 1); D.stats.left++;
  log(`<b>${p.size} ${p.size === 1 ? 'gast' : 'gasten'}</b> boos weggelopen.`);
  p.state = 'leave';
}
function cookHome(k) { return k < S.stoves ? { x: 125, y: stoveY(k) } : { x: 200, y: 470 - (k - S.stoves) * 30 }; }
function passTargetY(i, n) { const sp = Math.min(58, 440 / Math.max(1, n - 1)); return 72 + i * sp; }
function updCook(w, dt, k) {
  const home = cookHome(k);
  if (!w.task) {
    if (k < S.stoves && D.tickets.length) { const tk = D.tickets.shift(); w.task = { type: 'cook', tk, t: 0, dur: tk.item.dish.tijd / cookSpeed(w.st), stove: k }; }
    else { moveTo(w, home.x, home.y, 110, dt); return; }
  }
  w.busy += dt;
  const T = w.task;
  if (T.type === 'cook') {
    if (!moveTo(w, home.x, home.y, 110, dt)) return;
    T.t += dt;
    if (T.t >= T.dur) { if (T.tk.party.gone) { w.task = null; return; } T.type = 'carry'; }
  } else if (T.type === 'carry') {
    if (T.tk.party.gone) { w.task = null; return; }
    if (moveTo(w, 262, passTargetY(D.pass.length, D.pass.length + 1), 120, dt)) {
      D.pass.push({ id: uid++, tk: T.tk, temp: 100, q: w.st.b, x: 300, y: w.y, claimed: null });
      w.task = null;
    }
  }
}
function findWaiterTask(w) {
  const ordering = D.parties.filter(p => p.state === 'order' && !p.claimed).sort((a, b) => b.timer - a.timer);
  const dishes = D.pass.filter(d => !d.claimed).sort((a, b) => a.temp - b.temp);
  if (ordering[0] && ordering[0].timer > 5) { ordering[0].claimed = w; return { type: 'order', party: ordering[0], t: 0 }; }
  if (dishes[0]) { dishes[0].claimed = w; return { type: 'deliver', dish: dishes[0] }; }
  if (ordering[0]) { ordering[0].claimed = w; return { type: 'order', party: ordering[0], t: 0 }; }
  const dirty = D.tables.find(t => t.dirty && !t.claimed);
  if (dirty) { dirty.claimed = w; return { type: 'clean', table: dirty, t: 0 }; }
  return null;
}
function updWaiter(w, dt, k) {
  if (!w.task) w.task = findWaiterTask(w);
  if (!w.task) { moveTo(w, 362 + (k % 3) * 30, 245 + Math.floor(k / 3) * 34, 100, dt); return; }
  w.busy += dt;
  const T = w.task, sp = waiterSpeed(w.st), work = .6 + .2 * w.st.a;
  if (T.type === 'deliver') {
    if (!T.picked) {
      if (!D.pass.includes(T.dish)) { w.task = null; return; }
      if (moveTo(w, 338, T.dish.y, sp, dt)) { D.pass.splice(D.pass.indexOf(T.dish), 1); T.picked = true; w.carry = T.dish; }
    } else {
      const p = T.dish.tk.party;
      if (p.gone || !p.table) { w.carry = null; w.task = null; return; }
      if (moveTo(w, p.table.x - 56, p.table.y + 18, sp, dt)) { serveDish(T.dish); w.carry = null; w.task = null; }
    }
  } else if (T.type === 'order') {
    const p = T.party;
    if (p.gone || p.state !== 'order') { p.claimed = null; w.task = null; return; }
    if (moveTo(w, p.table.x - 56, p.table.y + 18, sp, dt)) { T.t += dt; if (T.t >= 1.5 / work) { takeOrder(p, w.st); w.task = null; } }
  } else if (T.type === 'clean') {
    const t = T.table;
    if (!t.dirty) { t.claimed = null; w.task = null; return; }
    if (moveTo(w, t.x - 56, t.y + 18, sp, dt)) { T.t += dt; if (T.t >= 2 / work) { t.dirty = false; t.claimed = null; w.task = null; } }
  }
}

/* ---------- jij als manager ---------- */
function managerAct(ud) {
  if (!isOpen() || !ud) return;
  let hit = null, fx = 0, fy = 0;
  if (ud.kind === 'dish') {
    const d = ud.dish;
    if (!D.pass.includes(d)) return;
    fx = d.x; fy = d.y;
    hit = () => { D.pass.splice(D.pass.indexOf(d), 1); serveDish(d); floater(d.x + 40, d.y, 'Zelf gebracht', '#e3b04b'); };
  } else if (ud.kind === 'table') {
    const t = D.tables[ud.i];
    if (!t) return;
    fx = t.x; fy = t.y;
    if (t.party && t.party.state === 'order') hit = () => { takeOrder(t.party, null); floater(t.x, t.y, 'Opgenomen', '#e3b04b'); };
    else if (t.dirty) hit = () => { t.dirty = false; floater(t.x, t.y, 'Schoon', '#74c66f'); };
  }
  if (!hit) return;
  if (D.mgrCd > 0) { floater(fx, fy, 'Even op adem komen…', '#a3b6ab'); return; }
  hit(); D.mgrCd = 2.5;
}

/* ---------- einde van de dag ---------- */
function endDay() {
  D.phase = 'report';
  const msgs = [];
  let wages = 0, unpaid = false;
  for (const x of S.staff) {
    if (S.cash >= x.loon) { S.cash -= x.loon; wages += x.loon; x.moraal = Math.min(100, x.moraal + 6); }
    else { x.moraal -= 40; unpaid = true; msgs.push(`${x.naam} is niet uitbetaald en is woedend.`); }
  }
  for (const w of D.workers) {
    const frac = w.busy / Math.max(1, D.t);
    if (frac > .85) { w.st.moraal -= 12; msgs.push(`${w.st.naam} vond het veel te druk (${Math.round(frac * 100)}% van de tijd bezig).`); }
  }
  S.staff.filter(x => x.moraal <= 0).forEach(x => msgs.push(`${x.naam} heeft ontslag genomen.`));
  S.staff = S.staff.filter(x => x.moraal > 0);
  const spoiled = [], max = freshTable().length;
  for (const d of DISHES) {
    S.stock[d.id].forEach(b => b.age++);
    const bad = S.stock[d.id].filter(b => b.age >= max).reduce((s, b) => s + b.qty, 0);
    if (bad) spoiled.push(`${bad}× ${d.naam.toLowerCase()}`);
    S.stock[d.id] = S.stock[d.id].filter(b => b.age < max);
  }
  if (spoiled.length) msgs.push(`Bedorven en weggegooid: ${spoiled.join(', ')}.`);
  S.debt = unpaid ? S.debt + 1 : 0;
  const over = S.debt >= 2;
  if (S.debt === 1) msgs.push('Let op: kun je morgen weer de lonen niet betalen, dan ga je failliet.');
  setBest(S.day);
  showReport(wages, msgs, over);
}
function starsHtml(n) { const r = Math.round(n); return '★'.repeat(r) + '<i>' + '★'.repeat(5 - r) + '</i>'; }

function act(a, id) {
  switch (a) {
    case 'tab': tab = id; break;
    case 'speed': speed = +id; break;
    case 'open': openDoors(); break;
    case 'next': nextDay(); return;
    case 'restart': newGame(); return;
    case 'hire': {
      const c = S.candidates.find(x => x.id == id); if (!c) break;
      if (S.staff.length >= 10) { toast('Maximaal 10 medewerkers.'); break; }
      S.staff.push(c); S.candidates = S.candidates.filter(x => x !== c); syncWorkers();
      log(`<b>${c.naam}</b> is aangenomen als ${c.role}.`); break;
    }
    case 'fire': {
      const x = S.staff.find(s => s.id == id); if (!x || D.phase !== 'prep') break;
      const fee = Math.round(x.loon / 2);
      if (S.cash < fee) { toast('Niet genoeg geld voor de ontslagvergoeding.'); break; }
      S.cash -= fee; S.staff = S.staff.filter(s => s !== x); syncWorkers();
      log(`<b>${x.naam}</b> is ontslagen.`); break;
    }
    case 'buy': {
      const c = buyCost(id); if (S.cash < c) { toast('Niet genoeg geld in kas.'); break; }
      S.cash -= c; D.stats.buy += c;
      const b = S.stock[id].find(b => b.age === 0); if (b) b.qty += 5; else S.stock[id].push({ qty: 5, age: 0 });
      break;
    }
    case 'menu': S.menu[id].on = !S.menu[id].on; break;
    case 'pminus': S.menu[id].prijs = Math.max(Math.ceil(DM[id].prijs * .5), S.menu[id].prijs - 1); break;
    case 'pplus': S.menu[id].prijs = Math.min(DM[id].prijs * 2, S.menu[id].prijs + 1); break;
    case 'upg': {
      const u = UPG.find(u => u.id === id); const c = u.cost();
      if (!u.can() || S.cash < c) break;
      S.cash -= c; D.stats.invest += c; u.apply(); log(`Gekocht: <b>${u.naam}</b>.`); break;
    }
  }
  renderAll(true);
}

  o.carry.visible = !!carried;
  if (carried) emojiTex(o.carry, carried, 2);
  const T = w.task, showProg = T && (T.type === 'order' || T.type === 'clean') && T.t > 0;
  o.prog.visible = !!showProg;
  if (showProg) barTex(o.prog, T.t / ((T.type === 'order' ? 1.5 : 2) / (.6 + .2 * w.st.a)), '#e3b04b', .5);
}
function createDish(d) {
  const root = new THREE.Group(); dyn.add(root);
  const plate = new THREE.Mesh(geo.plate, M('#fbf8ef', { roughness: .4 })); plate.castShadow = true; root.add(plate);
  const ring = new THREE.Mesh(geo.ring, new THREE.MeshBasicMaterial({ color: '#ec5a40' })); ring.rotation.x = Math.PI / 2; ring.position.y = .12; root.add(ring);
  const food = sprite(root, true, 5); food.position.y = 1.3;
  const steam = [0, 1, 2].map(() => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, transparent: true, depthWrite: false })); s.scale.set(1.1, 1.1, 1); root.add(s); return s; });
  const hit = new THREE.Mesh(geo.hit, hitMat); hit.userData = { kind: 'dish', dish: d }; root.add(hit);
  return { root, ring, food, steam, hit };
}
function updateDish(o, d, i, n, now) {
  d.x = 300; d.y += (passTargetY(i, n) - d.y) * .2;
  o.root.position.set(wx(300), 3.45, wz(d.y));
  const warm = d.tk.item.dish.warm;
  o.ring.material.color.set(warm ? tempColor(d.temp) : '#74c66f');
  emojiTex(o.food, d.tk.item.dish.emoji, 2.8);
  o.steam.forEach((s, j) => {
    const ph = (now / 1100 + j / 3) % 1;
    s.position.set(Math.sin(now / 300 + j * 2) * .5, 1.8 + ph * 2.6, 0);
    s.material.opacity = warm ? clamp((d.temp - 55) / 45, 0, 1) * (1 - ph) * .85 : 0;
  });
}
function tempColor(t) { const k = clamp((t - 35) / 55, 0, 1); const a = [124, 195, 232], b = [236, 90, 64]; return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`; }

function render3d(now) {
  const status = D.phase === 'open' ? (D.t >= OPEN_T ? ['KEUKEN SLUIT', '#ec5a40'] : ['OPEN', '#74c66f']) : ['GESLOTEN', '#ec5a40'];
  textTex(openSign, status[0], status[1], 1.8);
  // fornuizen
  const cooking = {};
  D.workers.forEach(w => { if (w.task && w.task.type === 'cook') cooking[w.task.stove] = w.task; });
  stovesG.forEach((o, k) => {
    o.real.visible = k < S.stoves; o.ghost.visible = k >= S.stoves;
    const T = cooking[k];
    if (T) o.burnMat.emissive.setRGB(1, .32 + .1 * Math.sin(now / 90 + k), .08); else o.burnMat.emissive.setRGB(0, 0, 0);
    o.pan.visible = o.food.visible = o.bar.visible = !!T;
    if (T) { emojiTex(o.food, T.tk.item.dish.emoji, 2.6); barTex(o.bar, T.t / T.dur, '#e3b04b', .6); }
  });
  // tafels
  tablesG.forEach((o, i) => {
    const t = D.tables[i], real = i < S.tables && !!t;
    o.real.visible = real; o.ghost.visible = !real;
    o.bubble.visible = o.bar.visible = o.food.visible = false;
    if (!real) return;
    o.dirty.visible = t.dirty;
    let bub = null, urgent = false;
    if (t.dirty) { bub = ['🧽']; urgent = true; }
    const p = t.party;
    if (p && p.state !== 'walk') {
      if (p.state === 'menu') bub = ['📖'];
      else if (p.state === 'order') { bub = ['📋']; urgent = true; }
      else if (p.state === 'eat') bub = ['😋'];
      else if (p.state === 'wait') bub = p.items.map(it => (it.served ? '' : '~') + it.dish.emoji);
      o.bar.visible = true;
      barTex(o.bar, p.mood / 100, moodColor(p.mood), .7);
      if (p.state === 'eat' || (p.state === 'wait' && p.items.some(it => it.served))) {
        o.food.visible = true;
        const served = p.items.filter(it => it.served).map(it => it.dish.emoji).join('');
        setTex(o.food, 'f:' + served, 64 * [...served].length / 2 + 32, 72, g => {
          g.font = `52px ${EMOJI}`; g.textBaseline = 'middle'; g.fillText(served, 8, 40);
        }, 1.6);
      }
    }
    if (bub) {
      o.bubble.visible = true; bubbleTex(o.bubble, bub, urgent);
      o.bubble.position.y = 9 + (urgent ? .25 * Math.sin(now / 140) : 0);
    }
  });
  syncMap(partyMap, D.parties, createParty, (o, p) => updateParty(o, p, now));
  syncMap(workerMap, D.workers, createWorker, (o, w) => updateWorker(o, w, now));
  const n = D.pass.length;
  syncMap(dishMap, D.pass, createDish, (o, d) => updateDish(o, d, D.pass.indexOf(d), n, now));
  syncMap(floatMap, D.floaters, f => { const root = sprite(dyn, false, 30); return { root }; }, (o, f) => {
    textTex(o.root, f.text, f.color, 2.1);
    o.root.position.set(wx(f.x), 8 + (1.6 - f.life) * 2.4, wz(f.y));
    o.root.material.opacity = clamp(f.life, 0, 1);
  });
  placeCamera();
  renderer.render(scene, camera);
}

/* camera draaien en klikken */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { id: e.pointerId, x: e.clientX, yaw: camYaw, moved: false }; });
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 8) { drag.moved = true; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  if (drag.moved) camYaw = clamp(drag.yaw - dx * .006, -.8, .8);
});
cv.addEventListener('pointerup', e => {
  if (!drag) return;
  const moved = drag.moved; drag = null;
  if (moved) return;
  const r = cv.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const targets = [...tablesG.filter((_, i) => i < S.tables).map(o => o.hit), ...[...dishMap.values()].map(o => o.hit)];
  const hits = ray.intersectObjects(targets, false);
  // gerechten gaan voor tafels als de klik op beide valt
  const h = hits.find(h => h.object.userData.kind === 'dish') || hits[0];
  if (h) managerAct(h.object.userData);
});
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); camDist = clamp(camDist + e.deltaY * .04, 55, 120); }, { passive: false });
cv.addEventListener('dblclick', () => { camYaw = 0; camDist = 84; });
document.fonts && document.fonts.ready.then(() => {
  texCache.forEach((t, k) => { if (k.startsWith('t:')) { t.dispose(); texCache.delete(k); } });
  scene.traverse(o => { if (o.isSprite && o.userData.key && o.userData.key.startsWith('t:')) { o.userData.key = null; o.userData.make && o.userData.make(); } });
});
buildStatic();

/* ---------- lus ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  if (!r.width) return;
  renderer.setSize(r.width, r.width * H / W, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(cv);
let last = performance.now(), uiTimer = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (D.phase === 'open' && speed > 0) {
    const steps = speed; for (let i = 0; i < steps; i++) update(dt);
    D.mgrCd = Math.max(0, D.mgrCd - dt);
  }
  D.floaters.forEach(f => { f.life -= dt; });
  D.floaters = D.floaters.filter(f => f.life > 0);
  render3d(now);
  renderTop();
  uiTimer -= dt; if (uiTimer <= 0) { uiTimer = .35; renderAll(); }
  requestAnimationFrame(frame);
}
function start(data) {
  S = (data && data.S) || load();
  if (S) {
    uid = Math.max(0, ...S.staff.map(x => x.id), ...S.candidates.map(x => x.id)) + 1;
    startDay();
  } else newGame();
  resize();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
